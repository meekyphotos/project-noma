# Point sherpa-rs-sys at the libraries vendored in this repo.
#
# Without this it downloads sherpa-onnx into a cache under %LOCALAPPDATA% and
# hands cargo linker flags pointing there. Cargo then caches those flags and
# will not re-run the build script unless its fingerprint changes, so clearing
# that cache breaks the build with `LNK1181: cannot open input file
# 'cargs.lib'` rather than fetching it again.
#
# `relative = true` resolves against the directory holding this file, so the
# path is correct on any machine and on CI without anyone exporting anything.
# It is not forced, so exporting SHERPA_LIB_PATH yourself still wins - which is
# how you would point a build at a CUDA or DirectML build of sherpa-onnx.
[env]
SHERPA_LIB_PATH = { value = "vendor/sherpa-onnx", relative = true }
