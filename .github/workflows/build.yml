name: build

# Three lanes, so every commit is downloadable without drowning the repo in
# releases:
#   every run    -> an Actions artifact attached to that run
#   push to main -> the rolling "nightly" prerelease, one permanent URL
#   a v* tag     -> a real, permanent versioned release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The repository default is read-only, so releases need this granted explicitly
# or `gh release` fails with "Resource not accessible by integration".
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # Cheap and OS-agnostic, so the two platform jobs below don't each re-derive
  # the same version and can't disagree about it. Reading Cargo.toml this way
  # never runs a build script, so it needs none of the sherpa-onnx toolchain.
  version:
    name: derive version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Derive version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --format-version 1 --no-deps |
            jq -r '.packages[] | select(.name == "noma") | .version')
          short=${GITHUB_SHA:0:7}

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            # A tag that disagrees with Cargo.toml would ship a binary whose
            # reported version is a lie. Catch it before either platform builds.
            if [[ "${tag#v}" != "$cargo_version" ]]; then
              echo "::error::tag $tag does not match the noma version $cargo_version in Cargo.toml"
              exit 1
            fi
            channel=stable
            version="$cargo_version"
          else
            channel=nightly
            version="$cargo_version+$short"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$channel $version"

  build-windows:
    name: x86_64-pc-windows-msvc
    needs: version
    # Pinned rather than windows-latest: a future flip of that alias must not
    # silently change what a release was built against.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # sherpa-rs-sys runs bindgen, and the published crate ships no
      # pre-generated bindings.rs. LLVM is on the image but LIBCLANG_PATH is
      # not set, so clang-sys only finds it by a fallback search. Pin it, and
      # fail loudly if a future image drops LLVM instead of failing deep inside
      # a build script.
      - name: Locate libclang
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @("C:\Program Files\LLVM\bin")
          $clang = Get-Command clang.exe -ErrorAction SilentlyContinue
          if ($clang) { $candidates += (Split-Path $clang.Source) }
          $hit = $candidates | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $hit) { throw "libclang.dll not found on this runner image; bindgen would fail" }
          "LIBCLANG_PATH=$hit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "libclang: $hit"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when the vendored sherpa-onnx version changes.
          key: sherpa-1.12.9-vendored-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --locked
        # The end-to-end Parakeet and microphone suites are #[ignore]d: one
        # needs a 465 MB model download, the other needs a real input device.

      - name: Build
        run: cargo build --release --locked -p noma

      - name: Package
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ needs.version.outputs.channel }}' -eq 'stable') {
            $stem = "noma-v${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc"
          } else {
            # A fixed name keeps /releases/download/nightly/<file> working.
            $stem = 'noma-nightly-x86_64-pc-windows-msvc'
          }
          "stem=$stem" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $stage = Join-Path $env:RUNNER_TEMP $stem
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item target\release\noma.exe $stage

          # Windows resolves imports from the executable's own directory, so
          # every DLL sits flat beside noma.exe - no bin/ or lib/ subfolder.
          Copy-Item target\release\*.dll $stage -ErrorAction SilentlyContinue

          # sherpa-rs-sys copies these next to the binary, but only when cargo
          # actually re-runs its build script, and only `if !dst.exists()`. A
          # restored cache can leave the build fingerprint-fresh while the DLLs
          # were pruned from target/, which produces a green build and an exe
          # that cannot start. They are vendored in this repo, so take them
          # from source rather than trusting the build script.
          Copy-Item vendor\sherpa-onnx\lib\*.dll $stage -Force
          $required = @(
            'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll',
            'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'cargs.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $stage $_)) }
          if ($missing) { throw "runtime DLLs missing from vendor\sherpa-onnx\lib: $($missing -join ', ')" }

          # onnxruntime.dll imports MSVCP140 and VCRUNTIME140, which a clean
          # Windows install does not have. Ship the runtime app-local so the
          # zip has no prerequisites; otherwise it fails before main() with a
          # missing-DLL dialog that says nothing about Noma.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw 'vswhere found no Visual Studio installation' }
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "no VC redistributable found under $vsPath" }
          Copy-Item "$($crt.FullName)\*.dll" $stage
          foreach ($dll in 'vcruntime140.dll', 'msvcp140.dll') {
            if (-not (Test-Path (Join-Path $stage $dll))) { throw "VC runtime missing: $dll" }
          }
          Write-Host "bundled the VC runtime from $($crt.FullName)"

          Copy-Item README.md $stage
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }

          $zip = Join-Path $env:RUNNER_TEMP "$stem.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $stem.zip" |
            Out-File "$zip.sha256" -Encoding ascii

          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$zip.sha256" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "zip: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

      # Every run, including pull requests, gets a downloadable build.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.stem }}
          path: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.meta.outputs.sha }}
          retention-days: 30
          if-no-files-found: error

  build-macos:
    name: aarch64-apple-darwin
    needs: version
    # Pinned rather than macos-latest, for the same reason as windows-2025.
    # GitHub's macos-15 runners are Apple Silicon, so this is a native arm64
    # build; the vendored sherpa-onnx libraries are a universal2 (arm64 +
    # x86_64) archive, so an Intel lane can be added later without re-vendoring.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: sherpa-1.12.9-vendored-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --locked
        # The end-to-end Parakeet and microphone suites are #[ignore]d: one
        # needs a 465 MB model download, the other needs a real input device.

      - name: Build
        run: cargo build --release --locked -p noma

      - name: Package
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.version.outputs.channel }}' == stable ]]; then
            stem="noma-v${{ needs.version.outputs.version }}-aarch64-apple-darwin"
          else
            # A fixed name keeps /releases/download/nightly/<file> working.
            stem='noma-nightly-aarch64-apple-darwin'
          fi
          echo "stem=$stem" >> "$GITHUB_OUTPUT"

          stage="$RUNNER_TEMP/$stem"
          mkdir -p "$stage"

          cp target/release/noma "$stage/"

          # Vendored in this repo, so take them from source rather than
          # trusting the build script - see the Windows job for why. The
          # unversioned libonnxruntime.dylib symlink is deliberately not
          # shipped: noma's Mach-O load command resolves to the versioned
          # name below regardless (confirmed with otool -L), so shipping the
          # symlink would only double the onnxruntime payload for nothing.
          cp vendor/sherpa-onnx/lib/libsherpa-onnx-c-api.dylib "$stage/"
          cp vendor/sherpa-onnx/lib/libsherpa-onnx-cxx-api.dylib "$stage/"
          cp vendor/sherpa-onnx/lib/libonnxruntime.1.17.1.dylib "$stage/"
          required=(libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib libonnxruntime.1.17.1.dylib)
          for f in "${required[@]}"; do
            if [[ ! -e "$stage/$f" ]]; then
              echo "::error::runtime dylib missing from vendor/sherpa-onnx/lib: $f"
              exit 1
            fi
          done

          cp README.md "$stage/"
          [[ -f LICENSE ]] && cp LICENSE "$stage/"

          zip="$RUNNER_TEMP/$stem.zip"
          # ditto, not zip: it is the tool Apple documents for this and
          # preserves the executable bit without extra flags.
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$stem.zip") > "$zip.sha256"

          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha=$zip.sha256" >> "$GITHUB_OUTPUT"
          ls -la "$stage"
          echo "zip: $(du -h "$zip" | cut -f1)"

      # Every run, including pull requests, gets a downloadable build.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.stem }}
          path: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.meta.outputs.sha }}
          retention-days: 30
          if-no-files-found: error

  # One job creates both releases, so the Windows and macOS builds land as two
  # assets on the same release instead of racing each other to create it -
  # two jobs both doing `gh release delete nightly && gh release create nightly`
  # would drop whichever asset lost the race.
  release:
    name: release
    needs: [version, build-windows, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release` resolves the target repository from the git remote in
      # the working directory, so without this it fails with "not a git
      # repository" before ever making an API call.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: "noma-*"
          path: dist
          merge-multiple: true

      - run: ls -la dist

      # Lane 2: one rolling prerelease that always points at the head of main.
      # Deleted and recreated rather than updated, because a release's tag
      # cannot be moved in place.
      - name: Update the nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete nightly --yes --cleanup-tag
          set -euo pipefail
          notes="Automatic build of the latest commit on \`main\`.

          Commit: ${{ github.sha }}
          Version: ${{ needs.version.outputs.version }}

          Unzip anywhere and run the app for your platform. The Parakeet model
          (~465 MB) is downloaded on first launch. This link always points at
          the newest commit, so it changes without warning - use a tagged
          release if you want a build that stays put."
          gh release create nightly \
            --target "${{ github.sha }}" \
            --title "nightly (${{ needs.version.outputs.version }})" \
            --notes "$notes" \
            --prerelease \
            --latest=false \
            dist/*

      # Lane 3: a real release, created only for a v* tag.
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create ${{ github.ref_name }} \
            --title "Noma ${{ github.ref_name }}" \
            --generate-notes \
            --latest \
            dist/*
